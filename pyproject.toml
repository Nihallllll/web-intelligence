[project]
name = "web-intelligence"
version = "0.3.0"
description = "Free, local web crawling + semantic search library. Fetch the internet, serve it to any LLM."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "web-crawling",
    "semantic-search",
    "embeddings",
    "vector-database",
    "rag",
    "llm",
    "retrieval",
    "gpu-acceleration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps — no LLM libraries forced. Users bring their own LLM.
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.4.0",
    "httpx[http2]>=0.25.0",
    "sentence-transformers>=2.2.0",
    "trafilatura>=1.6.0",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/web-intelligence"
Documentation = "https://github.com/yourusername/web-intelligence#readme"
Repository = "https://github.com/yourusername/web-intelligence"
Issues = "https://github.com/yourusername/web-intelligence/issues"

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
web-intelligence = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["web_intelligence"]
